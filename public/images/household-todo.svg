<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 520" width="990" height="520">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="appGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="990" height="520" fill="url(#bgGlow)"/>

  <!-- Subtle decorative task lines in the background -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="160" y1="210" x2="330" y2="210"/>
    <line x1="160" y1="260" x2="350" y2="260"/>
    <line x1="160" y1="310" x2="310" y2="310"/>
    <line x1="660" y1="210" x2="830" y2="210"/>
    <line x1="640" y1="260" x2="830" y2="260"/>
    <line x1="680" y1="310" x2="830" y2="310"/>
  </g>
  <!-- Background checkboxes -->
  <rect x="130" y="202" width="16" height="16" rx="4" fill="none" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="130" y="252" width="16" height="16" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="130" y="302" width="16" height="16" rx="4" fill="none" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  
  <rect x="844" y="202" width="16" height="16" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="844" y="252" width="16" height="16" rx="4" fill="none" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="844" y="302" width="16" height="16" rx="4" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Soft Indigo Glow Behind Icon -->
  <circle cx="495" cy="260" r="220" fill="url(#appGlow)"/>

  <!-- Center App Icon Tile -->
  <g filter="url(#tileShadow)">
    <rect x="365" y="130" width="260" height="260" rx="60" fill="url(#tileBg)"/>
    <rect x="365.75" y="130.75" width="258.5" height="258.5" rx="59.25" fill="none" stroke="url(#tileBorder)" stroke-width="1.5"/>
  </g>

  <!-- Lucide List-Checks Icon centered inside tile -->
  <g transform="translate(427, 192) scale(5.667)" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- check 1 -->
    <path d="m3 17 2 2 4-4"/>
    <!-- check 2 -->
    <path d="m3 7 2 2 4-4"/>
    <!-- line 1 -->
    <path d="M13 6h8"/>
    <!-- line 2 -->
    <path d="M13 12h8"/>
    <!-- line 3 -->
    <path d="M13 18h8"/>
  </g>

  <!-- Emerald Sparkles Badge on Bottom Right of Tile -->
  <g transform="translate(565, 330)">
    <circle cx="28" cy="28" r="24" fill="#10b981" stroke="#ffffff" stroke-width="3.5"/>
    <g transform="translate(16, 16) scale(1)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
      <path d="M20 3v4"/>
      <path d="M22 5h-4"/>
      <path d="M4 17v2"/>
      <path d="M5 18H3"/>
    </g>
  </g>
</svg>
